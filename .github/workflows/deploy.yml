name: Deploy Infrastructure and Website

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: 1.17.1
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '24'

jobs:
  build-nextjs:
    name: Build Next.js Application
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'personal-page-nextjs/package-lock.json'

      - name: Install dependencies
        working-directory: personal-page-nextjs
        run: npm ci

      - name: Build Next.js application
        working-directory: personal-page-nextjs
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextjs-build
          path: personal-page-nextjs/out/
          retention-days: 5

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ github.event_name == 'pull_request' && secrets.AWS_PLAN_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: |
          # PR plans are read-only; skip the state lock so parallel PRs don't collide.
          LOCK=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then LOCK="-lock=false"; fi
          if [ -n "${{ secrets.DOMAIN_NAME }}" ] && [ -n "${{ secrets.ACM_CERTIFICATE_ARN }}" ]; then
            terraform plan $LOCK \
              -var="domain_name=${{ secrets.DOMAIN_NAME }}" \
              -var="acm_certificate_arn=${{ secrets.ACM_CERTIFICATE_ARN }}" \
              -out=tfplan
          else
            terraform plan $LOCK -out=tfplan
          fi

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terraform-plan
          path: terraform/tfplan
          retention-days: 5

      - name: Display Plan
        working-directory: terraform
        run: terraform show tfplan

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    needs: terraform-plan
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Download Terraform Plan
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: terraform-plan
          path: terraform/

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Export Terraform Outputs
        working-directory: terraform
        run: |
          echo "INSTANCE_ID=$(terraform output -raw instance_id)" >> $GITHUB_ENV
          echo "CLOUDFRONT_ID=$(terraform output -raw cloudfront_id)" >> $GITHUB_ENV

  deploy-website:
    name: Deploy Website with Ansible
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    needs: [terraform-apply, build-nextjs]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download Next.js build artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: nextjs-build
          path: nextjs-build/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Ansible and dependencies
        run: |
          pip install -r requirements.txt

      - name: Install AWS Session Manager Plugin
        run: |
          curl "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o "session-manager-plugin.deb"
          sudo dpkg -i session-manager-plugin.deb

      - name: Setup Terraform (for outputs)
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init (for outputs)
        working-directory: terraform
        run: terraform init

      # ansible/inventory/hosts is gitignored and the local_file resource only
      # writes it on the apply runner, so render the same template here.
      - name: Generate Ansible inventory
        working-directory: terraform
        run: |
          INSTANCE_ID=$(terraform output -raw instance_id)
          BUCKET_NAME=$(terraform output -raw maintenance_bucket_name)
          mkdir -p ../ansible/inventory
          sed -e "s|\${instance_id}|${INSTANCE_ID}|g" \
              -e "s|\${bucket_name}|${BUCKET_NAME}|g" \
              -e 's|\$\${|${|g' \
              templates/inventory.tpl > ../ansible/inventory/hosts
          cat ../ansible/inventory/hosts

      - name: Wait for SSM agent
        run: |
          echo "Waiting 60 seconds for SSM agent to be ready..."
          sleep 60

      - name: Run Ansible Playbook
        working-directory: ansible
        run: ansible-playbook -i inventory/hosts playbook.yml
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'

  invalidate-cloudfront:
    name: Invalidate CloudFront Cache
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    needs: deploy-website
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform (for outputs)
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init (for outputs)
        working-directory: terraform
        run: terraform init

      - name: Get CloudFront Distribution ID
        working-directory: terraform
        run: |
          CLOUDFRONT_ID=$(terraform output -raw cloudfront_id)
          echo "CLOUDFRONT_ID=$CLOUDFRONT_ID" >> $GITHUB_ENV

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_ID }} \
            --paths "/*"

      - name: Display Website URLs
        working-directory: terraform
        run: |
          echo "🌍 Website deployed successfully!"
          echo "CloudFront URL: $(terraform output -raw cloudfront_url)"
          echo "Direct URL: $(terraform output -raw website_url)"
